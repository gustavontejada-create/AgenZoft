server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Páginas que ya no existen: ferregestion ya no es un producto y inmobiliariapro pasó a llamarse Raíces
    location = /ferregestion.html { return 301 /comerciopro.html; }
    location = /inmobiliariapro.html { return 301 /raices.html; }

    # La web nueva se probó primero en /web-v2/: se redirige a la raíz
    location = /web-v2/data/precios.json { return 301 /data/precios.json; }
    location ^~ /web-v2/ { return 301 /; }

    # Recursos estáticos: caché de una semana (al cambiarlos se sube el ?v= del enlace)
    location ~* \.(css|js|svg|png|jpg|jpeg|ico|mp4|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
